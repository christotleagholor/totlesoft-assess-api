app = "totlesoft-assess-api"
primary_region = "ams"

[build]

[processes]
  app = "npm start"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]  # <-- Add this line

[[services]]
  internal_port = 8080
  protocol = "tcp"
  processes = ["app"]  # <-- Add this line

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    grace_period = "30s"
    interval = "15s"
    restart_limit = 6
    timeout = "5s"