# fly.toml app configuration file generated for totlesoft-assess-api on 2026-10-19T14:12:22Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "totlesoft-assess-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
