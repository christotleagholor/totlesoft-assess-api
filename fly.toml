# fly.toml app configuration file
app = "totlesoft-assess-api" # Change this to your unique app name
primary_region = "iad" # Choose the region closest to your users (e.g., iad, lhr, sin)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5001"
  NODE_ENV = "production"

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = "stop"   # Stops the machine when idle to save money
  auto_start_machines = true    # Starts it back up on incoming requests
  min_machines_running = 0      # Allows scaling to zero

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1